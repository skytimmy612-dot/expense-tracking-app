<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>帳本</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- ── Home ── -->
    <section class="screen screen-home" id="screenHome">
      <header class="home-top">
        <h1 class="home-month" id="homeMonthTitle">2026年7月</h1>
      </header>

      <div class="home-scroll">
        <button type="button" class="balance-card" id="btnOpenReport">
          <div class="balance-main-card">
            <div class="balance-label">本月結餘</div>
            <div class="balance-amount" id="homeBalance">NT$ 0</div>
          </div>
          <div class="balance-row">
            <div class="balance-side">
              <span class="side-icon income-icon">↓</span>
              <div>
                <div class="side-label">收入</div>
                <div class="side-value income" id="homeIncome">NT$ 0</div>
              </div>
            </div>
            <div class="balance-side">
              <span class="side-icon expense-icon">↑</span>
              <div>
                <div class="side-label">支出</div>
                <div class="side-value expense" id="homeExpense">NT$ 0</div>
              </div>
            </div>
          </div>
        </button>

        <section class="home-panel panel-cats">
          <div class="panel-title">快速記帳</div>
          <div class="quick-cats" id="quickCats"></div>
        </section>

        <section class="home-panel panel-tx">
          <button type="button" class="section-head" id="btnViewAll" aria-expanded="false">
            <h2>最近交易</h2>
            <span class="section-head-action">
              <span class="section-head-label" id="viewAllLabel">查看全部</span>
              <svg class="section-head-chevron" id="viewAllChevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </span>
          </button>
          <div class="tx-list" id="recentList"></div>
        </section>
      </div>
    </section>

    <!-- ── Add ── -->
    <section class="screen screen-add hidden" id="screenAdd">
      <header class="add-top">
        <button type="button" class="icon-btn" id="btnCloseAdd" aria-label="關閉">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
        <h1 id="addScreenTitle">新增交易</h1>
        <button type="button" class="text-btn save-btn" id="btnSaveAdd">儲存</button>
      </header>

      <div class="add-scroll">
        <div class="type-seg" role="tablist">
          <button type="button" class="seg-btn active" data-type="expense">支出</button>
          <button type="button" class="seg-btn" data-type="income">收入</button>
          <button type="button" class="seg-btn" data-type="transfer" id="btnTransfer" title="即將推出">轉帳</button>
        </div>

        <div class="amount-block">
          <div class="amount-label">金額</div>
          <div class="amount-value" id="addAmountDisplay">NT$ 0</div>
        </div>

        <div class="cat-grid" id="addCatGrid"></div>

        <div class="field-list">
          <label class="field-row">
            <span class="field-icon">📅</span>
            <input type="date" id="addDate" />
            <span class="field-chevron">▾</span>
          </label>
          <div class="field-row field-static">
            <span class="field-icon">👛</span>
            <span>現金</span>
            <span class="field-chevron muted">▾</span>
          </div>
          <label class="field-row">
            <span class="field-icon">📝</span>
            <input type="text" id="addNote" placeholder="備註 (選填)" maxlength="80" />
          </label>
        </div>
      </div>

      <div class="keypad" id="keypad">
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key=".">.</button>
        <button type="button" class="key-back" data-key="back" aria-label="倒退">⌫</button>
        <button type="button" class="key-ok" data-key="ok" aria-label="確認">✓</button>
      </div>
    </section>

    <!-- ── Report ── -->
    <section class="screen screen-report hidden" id="screenReport">
      <header class="report-top">
        <button type="button" class="icon-btn" id="btnBackHome" aria-label="返回">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 6l-6 6 6 6" />
          </svg>
        </button>
        <h1 id="reportTitle">2026年7月報表</h1>
        <button type="button" class="icon-btn" aria-label="分享">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 3v12" />
            <path d="M8 7l4-4 4 4" />
            <path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" />
          </svg>
        </button>
      </header>

      <div class="report-scroll">
        <div class="period-seg">
          <button type="button" class="period-btn" data-period="week">週</button>
          <button type="button" class="period-btn active" data-period="month">月</button>
          <button type="button" class="period-btn" data-period="year">年</button>
        </div>

        <div class="report-summary">
          <div class="report-card">
            <div class="report-card-label">總支出</div>
            <div class="report-card-value" id="reportExpense">NT$ 0</div>
          </div>
          <div class="report-card">
            <div class="report-card-label">較上期</div>
            <div class="report-card-value change" id="reportChange">—</div>
          </div>
        </div>

        <div class="donut-wrap">
          <div class="donut-chart" id="donutChart">
            <svg viewBox="0 0 120 120" width="200" height="200" aria-hidden="true">
              <circle class="donut-track" cx="60" cy="60" r="42" />
              <g id="donutSlices"></g>
            </svg>
            <div class="donut-center">
              <div class="donut-center-label">本月支出</div>
              <div class="donut-center-value" id="donutCenter">NT$ 0</div>
            </div>
          </div>
          <div class="donut-legend" id="donutLegend"></div>
        </div>

        <h2 class="report-section-title">分類明細</h2>
        <div class="report-cat-list" id="reportCatList"></div>
      </div>
    </section>

    <div class="toast hidden" id="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
